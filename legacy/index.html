<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f7f7f7; --border:#e6e6e6; --border2:#cfcfcf;
  --text:#242424; --muted:#6b6b6b; --accent:#1a8917; --accent-ink:#fff;
  --article:#c4572f; --video:#2f8a5c; --short:#bf3f66; --workshop:#2f78b0; --podcast:#a9740f; --course:#7a4aa8; --newsletter:#1f8a8a; --carousel:#4a4fb8; --products:#6b8f1f;
  --ink-on-clay:#fff; --shadow:0 2px 12px rgba(0,0,0,.08); --shadow-lg:0 12px 40px rgba(0,0,0,.18);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --r:10px;
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1a1a1a; --surface2:#1f1f1f; --border:#2e2e2e; --border2:#444;
  --text:#e8e8e8; --muted:#9b9b9b; --accent:#4cc257; --accent-ink:#0b0b0b;
  --article:#ee8a63; --video:#5fc08c; --short:#ee7f9f; --workshop:#6fb0e3; --podcast:#e8b84a; --course:#b88ae0; --newsletter:#5fd4ce; --carousel:#9098e8; --products:#a8d65a;
  --ink-on-clay:#101010; --shadow:0 2px 12px rgba(0,0,0,.5); --shadow-lg:0 12px 40px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1a1a1a; --surface2:#1f1f1f; --border:#2e2e2e; --border2:#444;
    --text:#e8e8e8; --muted:#9b9b9b; --accent:#4cc257; --accent-ink:#0b0b0b;
    --article:#ee8a63; --video:#5fc08c; --short:#ee7f9f; --workshop:#6fb0e3; --podcast:#e8b84a; --course:#b88ae0; --newsletter:#5fd4ce; --carousel:#9098e8; --products:#a8d65a;
    --ink-on-clay:#101010; --shadow:0 2px 12px rgba(0,0,0,.5); --shadow-lg:0 12px 40px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{border-radius:999px;border:2px solid transparent;background-clip:padding-box;background-color:var(--border2)}
::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;min-height:100vh;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- base surfaces: flat, hairline ---------- */
.clay{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.tint{background:var(--surface)}
.well{border-radius:8px;background:var(--surface2);border:1px solid transparent}
.btn{padding:.42rem .95rem;border-radius:999px;font-weight:500;font-size:.85rem;display:inline-flex;gap:.4rem;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border2);transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.92)}
.btn.danger{color:#b4352a;border-color:color-mix(in srgb,#b4352a 45%,var(--border))}
:root[data-theme="dark"] .btn.danger{color:#f09a8a}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{padding:.3rem .85rem;border-radius:999px;font-weight:500;font-size:.84rem;display:inline-flex;align-items:center;gap:.45rem;background:var(--surface2);border:1px solid transparent;color:var(--muted);transition:background .15s,color .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--text);color:var(--bg)}
.chip .dot{width:.55em;height:.55em;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;font-size:.74rem;font-weight:500;opacity:.7}

.ring{position:relative;width:var(--s,64px);height:var(--s,64px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--border);fill:none}
.ring .fg{fill:none;stroke:var(--c,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.7em;font-weight:600}
.bar{height:4px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s ease}

/* ---------- page ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:0 28px 90px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;margin:0 0 36px;position:sticky;top:0;z-index:20;
  background:var(--bg);border:0;border-bottom:1px solid var(--border);border-radius:0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--serif);font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-weight:400;font-size:.85rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}


.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:36px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.capture-card{padding:22px 26px;display:flex;gap:18px;align-items:center;text-align:left;background:var(--text);color:var(--bg);border:0;border-radius:0;transition:filter .15s}
.capture-card:hover{filter:brightness(1.15)}
:root[data-theme="dark"] .capture-card:hover{filter:brightness(.9)}
.capture-card .plus{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.6rem;font-weight:300;line-height:1;background:var(--accent);color:var(--accent-ink)}
.capture-card b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.2}
.capture-card span{font-weight:400;font-size:.84rem;opacity:.8}
.stat{padding:22px 26px;display:flex;flex-direction:column;justify-content:center;background:var(--surface);border:0;border-left:1px solid var(--border);border-radius:0}
.stat small{color:var(--muted);font-weight:500;font-size:.78rem}
.stat b{font-family:var(--serif);font-size:2.2rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.controls .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;padding:.42rem 1rem;border-radius:999px;min-width:240px;background:var(--surface2)}
.search input{border:0;background:none;outline:0;width:100%}

/* ---------- pipeline sections ---------- */
.pipes{display:flex;flex-direction:column;gap:0}
.pipe{padding:36px 0 12px;background:transparent;border:0;border-top:1px solid var(--border);border-radius:0}
.pipe:first-child{border-top:0}
.pipe-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pipe-head h2{margin:0;font-family:var(--serif);font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.pipe-head p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.pipe-head .grow{flex:1;min-width:160px}
.pipe-ico{width:auto;height:auto;font-size:1.7rem;line-height:1;background:none;box-shadow:none}
.stages{display:flex;align-items:stretch;overflow-x:auto;padding:2px 0 16px}
.stagecol{width:236px;flex:none;display:flex;flex-direction:column;gap:8px}
.arrow{flex:none;width:20px;display:grid;place-items:start center;padding-top:9px;color:var(--border2);font-size:1.1rem}
.stagehead{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:6px;text-align:left;width:100%;transition:background .15s}
.stagehead:hover{background:var(--surface2)}
.stagehead .n{flex:none;min-width:20px;font-size:.74rem;font-weight:600;color:var(--c);background:none}
.stagehead b{font-size:.88rem;font-weight:600;line-height:1.25;flex:1}
.stagehead em{font-style:normal;font-size:.76rem;font-weight:500;color:var(--muted)}
.stagecol .tag{font-size:.66rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-left:33px;margin-top:-6px}
.dropwell{flex:1;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:8px;transition:background .15s,border-color .15s}
.dropwell.over{background:color-mix(in srgb,var(--c) 8%,var(--surface2));border:1px dashed var(--c)}
.dropwell .empty{margin:auto;color:var(--muted);font-size:.76rem;opacity:.7;text-align:center}

.idea{padding:12px 14px;border-radius:8px;display:flex;flex-direction:column;gap:7px;text-align:left;cursor:grab;position:relative;
  background:var(--surface);border:1px solid var(--border);transition:border-color .15s,box-shadow .15s}
.idea:hover{border-color:var(--text);box-shadow:var(--shadow)}
.idea.dragging{opacity:.4}
.idea.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.idea h4{margin:0;font-family:var(--serif);font-size:1rem;font-weight:700;line-height:1.3;letter-spacing:-.005em}
.idea p{margin:0;font-size:.78rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pri{font-size:.68rem;font-weight:600;color:var(--muted)}
.pri::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;margin-right:.35em;background:var(--border2)}
.pri.high::before{background:#c0392b}.pri.med::before{background:#d99a1c}.pri.low::before{background:var(--video)}
.tg{font-size:.68rem;font-weight:500;padding:.05rem .5rem;border-radius:99px;color:var(--muted);background:var(--surface2)}
.pubbadge{margin-left:auto;font-size:.72rem;font-weight:600;color:var(--accent)}
.outs{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.outs span{font-size:.76rem;font-weight:500;padding:.25rem .7rem;border-radius:99px;background:var(--surface);border:1px solid var(--border2)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(255,255,255,.75);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
:root[data-theme="dark"] .scrim{background:rgba(0,0,0,.6)}
.scrim.open{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;padding:0;overflow:hidden;--r:0;border:0;border-radius:0;box-shadow:none;transform:translateY(18px);opacity:0;pointer-events:none;transition:transform .3s ease,opacity .2s}
aside.drawer.open{transform:none;opacity:1;pointer-events:auto}
.x{position:absolute;top:18px;right:18px;width:34px;height:34px;padding:0!important}
.kicker{font-weight:500;font-size:.8rem;color:var(--muted)}
.drawer h2{margin:6px 40px 10px 0;font-family:var(--serif);font-size:2rem;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.sum{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.drawer h5{margin:28px 0 10px;padding-top:18px;border-top:1px solid var(--border);font-size:.78rem;letter-spacing:.02em;color:var(--muted);font-weight:600}
.stepper{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.stepper button{flex:none;width:30px;height:30px;border-radius:50%;font-weight:500;font-size:.78rem;display:grid;place-items:center;border:1px solid var(--border2);color:var(--muted)}
.stepper button:hover{border-color:var(--text);color:var(--text)}
.stepper button.past{background:var(--surface2);color:var(--text)}
.stepper button.now{background:var(--text);color:var(--bg);border-color:var(--text)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.fact{padding:0}
.fact small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.fact b{font-size:.92rem;font-weight:600}
.chk{display:flex;flex-direction:column;gap:2px;list-style:none;padding:0;margin:0}
.chk label{display:flex;gap:12px;align-items:center;padding:8px 2px;cursor:pointer;border-bottom:1px solid var(--border)}
.chk input{appearance:none;width:18px;height:18px;border-radius:4px;flex:none;background:var(--surface);border:1.5px solid var(--border2);display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--c);border-color:var(--c)}
.chk input:checked::after{content:"✓";font-weight:700;font-size:.7rem;color:var(--ink-on-clay)}
.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
.chk.ro label{cursor:default}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:.25rem .75rem;border-radius:99px;font-weight:500;font-size:.8rem;background:var(--surface2)}
.refine{padding:2px 0 2px 16px;border-left:3px solid var(--c);font-family:var(--serif);font-size:1.02rem;font-style:italic;color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label,.field .lab{font-weight:600;font-size:.8rem;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=date],textarea{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--border2);border-radius:0;background:transparent;font-size:1rem;transition:border-color .15s}
.field input[type=text]#fTitle{font-family:var(--serif);font-size:1.4rem;font-weight:700}
textarea{min-height:84px;resize:vertical;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
.field input:focus,textarea:focus{outline:0;border-color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.modal{position:fixed;z-index:55;left:50%;top:50%;width:min(600px,calc(100% - 24px));max-height:calc(100vh - 28px);overflow:auto;padding:36px 38px;--r:12px;
  box-shadow:var(--shadow-lg);transform:translate(-50%,-47%);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s}
.modal.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.modal h2{margin:2px 40px 6px 0;font-family:var(--serif);font-size:2rem;font-weight:700;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,220%);padding:.6rem 1.2rem;z-index:70;font-weight:500;font-size:.88rem;border-radius:999px;background:var(--text);color:var(--bg);border:0;transition:transform .3s ease}
.toast.show{transform:translate(-50%,0)}

@media (max-width:1000px){}
@media (max-width:640px){
  .wrap{padding:0 16px 70px}header.top{position:static;margin-bottom:24px}
  
  .stagecol{width:210px}
  aside.drawer{padding:0}
  .modal{padding:28px 22px}
}
/* ---------- archive folder + collection ---------- */
.stagecol.archive{width:210px}
.ic-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}.ic-top .pubbadge{margin-left:auto}
.ic-foot{display:flex;align-items:center;gap:10px;margin-top:4px}.ic-foot .bar{flex:1}
.ic-arch{border:0;background:none;padding:0;font-size:.74rem;color:var(--muted);white-space:nowrap}.ic-arch:hover{color:var(--text);text-decoration:underline}
.idea{padding:14px 16px;gap:8px}.idea h4{font-size:1.05rem;margin-top:2px}.idea p{font-size:.8rem;line-height:1.5}

.arc-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.arc-sec{margin-top:26px}
.arc-sec h3{margin:0 0 14px;font-family:var(--serif);font-size:1.25rem;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--border)}
.arc-sec h3 span{font-family:'Inter',sans-serif;font-size:.78rem;color:var(--muted);font-weight:500;margin-left:6px}
.arc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.arc-card{padding:16px;border:1px solid var(--border);border-top:3px solid var(--c);border-radius:8px;display:flex;flex-direction:column;gap:9px;background:var(--surface)}
.arc-card h4{margin:0;font-family:var(--serif);font-size:1.1rem;line-height:1.3}
.arc-card p{margin:0;color:var(--muted);font-size:.85rem}
.arc-card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.arc-card .when{font-size:.74rem;color:var(--muted);margin-left:auto}
.arc-act{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.arc-empty{text-align:center;padding:48px 0;color:var(--muted)}
.arc-empty div{font-size:2.6rem}
.arc-empty b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--text)}
/* ---------- idea dialog (75%) ---------- */
.drawer{display:flex;flex-direction:column}
.drawer .dlg-head{display:flex;align-items:flex-start;gap:24px;padding:24px 32px 18px;border-bottom:1px solid var(--border);position:relative;flex:none}
.dlg-title{flex:1;min-width:0}
.drawer .dlg-title h2{margin:4px 0 6px;font-size:1.9rem}
.dlg-title .sum{margin:0 0 8px}
.dlg-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dlg-meta a{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:6px}
.title-row{display:flex;align-items:center;gap:14px}.title-row h2{margin:0 40px 0 0}.pico .pi{position:absolute;inset:0;display:grid;place-items:center;font-size:1.35rem}.dlg-title .kicker{margin-bottom:10px}
.dlg-prog{display:flex;align-items:center;gap:12px;margin-right:48px;flex:none}
.dlg-prog b{display:block;font-size:.88rem}
.dlg-prog span{display:block;color:var(--muted);font-size:.8rem}
.drawer .x{top:20px;right:22px}
.dlg-body{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr}
.rail{border-right:1px solid var(--border);padding:20px 14px;overflow:auto;background:var(--surface2)}
.drawer .rail h5{margin:0 0 12px 8px;padding:0;border:0}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rail li{position:relative}
.rail li:not(:last-child)::before{content:"";position:absolute;left:25px;top:40px;bottom:-2px;width:2px;background:var(--border2)}
.rs{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:7px 8px;border-radius:10px;position:relative;z-index:1}
.rs:hover{background:var(--bg)}
.rs.now{background:var(--bg)}
.rs .dot{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:600;border:1.5px solid var(--border2);background:var(--surface);color:var(--muted)}
.rs.past .dot{background:var(--c);border-color:var(--c);color:var(--ink-on-clay)}
.rs.now .dot{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.rs .t b{display:block;font-size:.88rem;font-weight:600;line-height:1.25}
.rs .t small{color:var(--muted);font-size:.74rem}
.rs.upcoming .t b{color:var(--muted);font-weight:500}
.dlg-main{overflow:auto;padding:26px 34px 30px}
.stage-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:24px}
.big-ico{font-size:2.3rem;line-height:1}
.stage-head h3{margin:0;font-family:var(--serif);font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stage-head p{margin:4px 0 0;color:var(--muted)}
.pill{margin-left:auto;font-size:.72rem;font-weight:600;padding:.2rem .7rem;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:40px}
.dlg-main .blk{margin-bottom:24px}
.drawer .dlg-main h5{margin:0 0 10px;padding:0;border:0}
.dlg-main .facts{margin:0 0 24px}
.dlg-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 32px;border-top:1px solid var(--border);background:var(--surface);flex:none}
.dlg-foot .grp{display:flex;gap:10px;flex-wrap:wrap}
.dlg-foot .btn{padding:.5rem 1.1rem}
@media (max-width:820px){
  .dlg-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--border);padding:10px}
  .rail h5{display:none}.rail ol{flex-direction:row;overflow-x:auto;gap:4px}.rail li::before{display:none}.rail li{flex:none}
  .rs .t small{display:none}.rs{padding:6px 10px 6px 6px}
  .cols{grid-template-columns:1fr;gap:0}
  .dlg-head{padding:18px 18px 14px}.dlg-prog{display:none}.dlg-main{padding:20px 18px}.dlg-foot{padding:12px 16px}
  .drawer .dlg-title h2{font-size:1.5rem}
}

/* ---------- archive: full page ---------- */

}
/* ---------- title bar ---------- */
header.top{gap:16px}
.brand h1{font-size:1.75rem;letter-spacing:-.03em}
.tools{gap:10px}
.tools .search{min-width:280px}
.tools .chip{padding:.4rem .95rem}

.controls{margin-bottom:4px;gap:10px}

/* ---------- pipeline pills ---------- */
.chip{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:.4rem .9rem .4rem .8rem;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
.chip:hover{border-color:var(--c,var(--text));color:var(--text)}
.chip .dot{width:.7em;height:.7em;box-shadow:none}
.chip em{font-style:normal;font-size:.72rem;font-weight:600;padding:.02rem .5rem;border-radius:99px;background:var(--surface2);color:var(--muted);opacity:1}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--c,var(--text));border-color:var(--c,var(--text));color:var(--ink-on-clay);font-weight:600;
  box-shadow:0 5px 14px -5px color-mix(in srgb,var(--c,var(--text)) 70%,transparent);transform:translateY(-1px)}
.chip[aria-pressed="true"] .dot,.chip[aria-checked="true"] .dot{background:var(--ink-on-clay)}
.chip[aria-pressed="true"] em,.chip[aria-checked="true"] em{background:color-mix(in srgb,var(--ink-on-clay) 24%,transparent);color:var(--ink-on-clay)}

/* ---------- archive folder ---------- */
.dropwell.fbtn{flex:none;min-height:0;padding:0;background:none;border:0;display:block;width:100%;cursor:pointer;text-align:left;margin-top:18px}
.dropwell.fbtn.over{background:none;border:0}
.fld{display:block;position:relative;height:158px}
.fld-back{position:absolute;left:0;right:0;top:14px;bottom:0;background:color-mix(in srgb,var(--c) 68%,#000);border-radius:0 14px 14px 14px}
.fld-back::before{content:"";position:absolute;left:0;top:-13px;width:46%;height:16px;background:inherit;border-radius:10px 10px 0 0}
.paper{position:absolute;left:12px;right:12px;height:80px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;
  font-size:.74rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:translate .25s ease}
.paper.p0{top:2px;transform:rotate(-1.6deg)}
.paper.p1{top:19px;transform:rotate(1deg)}
.paper.p2{top:36px;transform:rotate(-.5deg)}
.fld-front{position:absolute;left:0;right:0;bottom:0;height:92px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c));color:var(--ink-on-clay);border-radius:6px 14px 14px 14px;
  box-shadow:0 -3px 10px rgba(0,0,0,.14);transform-origin:50% 100%;transition:transform .25s ease}
.fld-front b{font-family:var(--serif);font-size:1.9rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.fld-front .lbl{font-size:.82rem;font-weight:600}
.fld-front small{font-size:.74rem;font-weight:500;opacity:.85}
.fbtn:hover .fld-front,.fbtn.over .fld-front,.fbtn:focus-visible .fld-front{transform:perspective(600px) rotateX(-14deg)}
.fbtn:hover .paper,.fbtn.over .paper,.fbtn:focus-visible .paper{translate:0 -6px}

@media (max-width:640px){
  .hero{grid-template-columns:repeat(3,1fr)}
  .stat{padding:14px}.stat b{font-size:1.7rem}
  .tools{width:100%}.tools .search{order:9;flex:1 1 100%;min-width:0}
}
/* ---------- pull-cord bulb ---------- */
.bulb{position:fixed;top:0;left:min(calc(50% + 732px),calc(100% - 56px));width:48px;height:120px;padding:0;border:0;background:none;pointer-events:none;z-index:30}
.bulb svg{width:100%;height:100%;overflow:visible;display:block}
.bulb .hit{pointer-events:all;cursor:grab;touch-action:none}
.bulb.dragging .hit{cursor:grabbing}
.bulb:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:12px}
.bulb .swing{transform-origin:30px 0;animation:sway 5s ease-in-out infinite}
.bulb .swing.kick{animation:kick 1.1s cubic-bezier(.2,.7,.3,1) 1}
@keyframes sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes kick{0%{transform:rotate(0)}18%{transform:rotate(7deg)}40%{transform:rotate(-5deg)}62%{transform:rotate(3deg)}82%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
.bulb .wire{stroke:var(--muted);stroke-width:2}
.bulb .cord{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:2 2}
.bulb .holder{fill:#4a4a4a}
.bulb .ridge{fill:none;stroke:#6b6b6b;stroke-width:1.1;stroke-linecap:round}
.bulb .glass{fill:url(#bulbFill);stroke:#d9a620;stroke-width:1.4;filter:drop-shadow(0 0 8px rgba(255,205,70,.9));transition:stroke .25s}
.bulb .support{fill:none;stroke:#b8860b;stroke-width:1.1;stroke-linecap:round;opacity:.55}
.bulb .shine{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;opacity:.75}
.bulb .glow{opacity:.9;transition:opacity .3s}
.bulb .handle{fill:var(--text)}
:root[data-theme="dark"] .bulb .glass{fill:#2a2a2d;stroke:#6a6a70;filter:none}
:root[data-theme="dark"] .bulb .support{stroke:#8a8a90;opacity:.5}
:root[data-theme="dark"] .bulb .shine{opacity:.28}
:root[data-theme="dark"] .bulb .glow{opacity:0}
:root[data-theme="dark"] .bulb .holder{fill:#8a8a90}
@media (max-width:640px){.bulb{width:36px;height:90px;left:calc(100% - 44px)}}
@media (min-width:641px) and (max-width:1620px){.wrap{padding-right:62px}}

/* ---------- vertical view (one pipeline selected) ---------- */

@media (max-width:760px){
  .stages.vertical .stagecol{grid-template-columns:1fr}

}

const FS={mem:new Map(),
  db(){return this.p||(this.p=new Promise(res=>{try{const r=indexedDB.open('prox-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}}))},
  async put(k,blob){const db=await this.db();if(!db){this.mem.set(k,blob);return false}
    return new Promise(r=>{try{const t=db.transaction('f','readwrite');t.objectStore('f').put(blob,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>{this.mem.set(k,blob);r(false)}}catch(e){this.mem.set(k,blob);r(false)}})},
  async get(k){if(this.mem.has(k))return this.mem.get(k);const db=await this.db();if(!db)return null;
    return new Promise(r=>{try{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  async del(k){this.mem.delete(k);const db=await this.db();if(!db)return;try{db.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}};

async function openFile(sid,download){
  const i=cur();if(!i)return;const s=resOf(i).sources.find(x=>x.id===sid);if(!s||!s.file)return;
  const win=!download&&previewable(s.file.type)?window.open('','_blank'):null;
  const blob=await FS.get(s.file.key);
  if(!blob){win&&win.close();toast('That file is no longer stored in this browser');return}
  const url=URL.createObjectURL(blob);
  if(win){win.location=url}else{const a=document.createElement('a');a.href=url;a.download=s.file.name;document.body.appendChild(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function addFiles(files){

  for(const file of files){
    if(file.size>MAX_FILE){big++;continue}
    const key=uid();await FS.put(key,file);
    r.sources.push({id:uid(),kind:'doc',url:'',title:file.name,file:{key,name:file.name,size:file.size,type:file.type||''},note:''});n++;
  }
  if(n&&r.status==='todo')r.status='doing';
  save();if(curId===i.id){paintDrawer()}render();
  if(n)toast(n===1?'Document uploaded':n+' documents uploaded');
  if(big)toast(big+' file'+(big>1?'s':'')+' over 25 MB skipped');
}

/* the article lives in one Editor.js document; the outline is its headings */
const docOf=i=>i.doc||(i.doc={time:Date.now(),blocks:[]});
const stripHTML=s=>String(s==null?'':s).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
const itemText=it=>typeof it==='string'?it:(it&&(it.content!=null?it.content:it.text))||'';
function flatItems(items,fn,depth){depth=depth||0;(items||[]).forEach(it=>{fn(it,depth);if(it&&it.items)flatItems(it.items,fn,depth+1)})}
function blockPlain(b){
  const d=b.data||{};
  switch(b.type){
    case'header':case'paragraph':return stripHTML(d.text);
    case'quote':return stripHTML(d.text)+(d.caption?' '+stripHTML(d.caption):'');
    case'list':case'checklist':{const s=[];flatItems(d.items,it=>s.push(stripHTML(itemText(it))));return s.join(' ')}
    case'code':return d.code||'';
    case'table':return [].concat.apply([],d.content||[]).map(stripHTML).join(' ');
    case'image':return stripHTML(d.caption);
    default:return '';
  }
}
const wordsOf=i=>{const t=docOf(i).blocks.map(blockPlain).join(' ').trim();return t?t.split(/\s+/).length:0};
const lvOf=b=>(b.data&&b.data.level)||2;
const hdrs=i=>{const o=[];docOf(i).blocks.forEach((b,ix)=>{if(b.type==='header')o.push({b,ix,lv:lvOf(b)})});return o};
function secEnd(bl,ix){const lv=lvOf(bl[ix]);let e=ix+1;while(e<bl.length&&!(bl[e].type==='header'&&lvOf(bl[e])<=lv))e++;return e}
function hasBody(bl,ix){for(let k=ix+1;k<bl.length&&bl[k].type!=='header';k++){if(blockPlain(bl[k]).trim()||bl[k].type==='image')return true}return false}

function moveSection(bl,ix,beforeIx){
  const e=secEnd(bl,ix);if(beforeIx>ix&&beforeIx<e)return false;
  const seg=bl.splice(ix,e-ix);if(beforeIx>ix)beforeIx-=seg.length;
  bl.splice.apply(bl,[beforeIx,0].concat(seg));return true;
}
/* outline operations act directly on the document blocks */
function olOp(i,op,hid,arg){
  const bl=docOf(i).blocks,ix=bl.findIndex(b=>b.id===hid);if(ix<0)return null;
  const b=bl[ix],lv=lvOf(b);let ret=hid;
  if(op==='lv'){b.data.level=Math.min(6,Math.max(1,arg))}
  else if(op==='del'){bl.splice(ix,1);ret=null}
  else if(op==='add'){const nb=mkHeader('',lv);bl.splice(secEnd(bl,ix),0,nb);ret=nb.id}
  else if(op==='up'){let p=ix-1;while(p>=0&&!(bl[p].type==='header'&&lvOf(bl[p])<=lv))p--;if(p<0||lvOf(bl[p])!==lv)return ret;moveSection(bl,ix,p)}
  else if(op==='down'){const e=secEnd(bl,ix);if(e>=bl.length||bl[e].type!=='header'||lvOf(bl[e])!==lv)return ret;moveSection(bl,ix,secEnd(bl,e))}
  else if(op==='before'){moveSection(bl,ix,arg)}
  docOf(i).time=Date.now();return ret;
}
function olRows(i){
  const bl=docOf(i).blocks,stack=[];
  return hdrs(i).map(h=>{
    while(stack.length&&stack[stack.length-1].lv>h.lv)stack.pop();
    if(stack.length&&stack[stack.length-1].lv===h.lv)stack[stack.length-1].n++;else stack.push({lv:h.lv,n:1});
    const num=stack.map(s=>s.n).join('.'),w=hasBody(bl,h.ix);
    return `<li class="ol-row" data-hid="${h.b.id}" style="--d:${stack.length-1}"><span class="ol-grip" title="Drag to move this section" aria-hidden="true">⋮⋮</span><span class="ol-num">${num}</span>
      <select class="ol-lv" data-x-lv aria-label="Heading level">${[1,2,3,4,5,6].map(n=>`<option value="${n}"${n===h.lv?' selected':''}>H${n}</option>`).join('')}</select>
      <input class="ol-in lv${h.lv}" data-x-ol value="${esc(stripHTML(h.b.data.text))}" placeholder="Heading" aria-label="Heading text">
      <span class="ol-state${w?' ok':''}">${w?'✓ written':''}</span><button class="rs-x" data-x-oldel aria-label="Remove heading" title="Remove heading">✕</button></li>`;
  }).join('');
}
function olInner(i){
  const hs=hdrs(i),bl=docOf(i).blocks,depth=hs.length?new Set(hs.map(h=>h.lv)).size:0,written=hs.filter(h=>hasBody(bl,h.ix)).length;
  return `<div class="rs-stats"><span><b>${hs.length}</b> headings</span><span><b>${depth}</b> levels</span><span><b>${written}</b> sections written</span></div>
    <ol class="ol-list" id="olList">${olRows(i)}</ol>
    ${hs.length?'':`<div class="ol-empty"><p>No structure yet.</p><button class="btn" data-x-starter type="button">Start with Intro · Body · Conclusion</button></div>`}`;
}
function outlineHTML(i){
  return `${trackerHTML(i,'a-outline')}
   <section class="rs-sec"><h5>Article structure</h5><p class="rs-hint">Headings only, H1 to H6. Enter adds one, Tab changes its level, Alt+↑↓ moves its section.</p>
   <div id="olWrap">${olInner(i)}</div>
   <form class="rs-add" data-x-oladd autocomplete="off"><input type="text" name="v" placeholder="Add a heading…" aria-label="Add a heading"><select name="lv" aria-label="Level">${[1,2,3,4,5,6].map(n=>`<option value="${n}"${n===2?' selected':''}>H${n}</option>`).join('')}</select><button class="btn primary" type="submit">+ Add</button></form></section>`;
}
let olSort=null;
function olPaint(i,focusId){
  const w=document.getElementById('olWrap');if(!w)return;
  w.innerHTML=olInner(i);olBind(i);
  if(focusId){const r=w.querySelector(`[data-hid="${focusId}"] .ol-in`);r&&r.focus()}
}
function olBind(i){
  const list=document.getElementById('olList');if(olSort){try{olSort.destroy()}catch(e){}olSort=null}
  if(!list||typeof Sortable==='undefined')return;
  olSort=Sortable.create(list,{handle:'.ol-grip',animation:150,ghostClass:'ol-ghost',onEnd(ev){
    const bl=docOf(i).blocks,hid=ev.item.dataset.hid,nx=ev.item.nextElementSibling;
    const before=nx?bl.findIndex(b=>b.id===nx.dataset.hid):bl.length;
    const ix=bl.findIndex(b=>b.id===hid);
    if(ix>=0&&moveSection(bl,ix,before)){docOf(i).time=Date.now();touch(i,'a-outline');save()}
    olPaint(i,hid);
  }});
}

const imgCache=new Map();
async function blobURL(key){
  if(imgCache.has(key))return imgCache.get(key);
  const b=await FS.get(key);if(!b)return '';
  const u=URL.createObjectURL(b);imgCache.set(key,u);return u;
}
async function hydrateImgs(root){
  for(const im of (root||document).querySelectorAll('img[data-ikey]')){
    const u=await blobURL(im.dataset.ikey);if(u)im.src=u;
  }
}
const safeUrl=u=>/^(https?:|mailto:|blob:|data:image\/)/i.test(String(u||'').trim())?String(u).trim():'';
/* keep only simple inline markup when rendering stored HTML */
function cleanInline(s){
  const t=document.createElement('template');t.innerHTML=String(s==null?'':s);
  const ok={B:1,STRONG:1,I:1,EM:1,U:1,MARK:1,CODE:1,BR:1,A:1,S:1};
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3)return;
      if(c.nodeType!==1){c.remove();return}
      walk(c);
      if(!ok[c.tagName]){c.replaceWith(...c.childNodes);return}
      [...c.attributes].forEach(a=>{if(!(c.tagName==='A'&&a.name==='href'))c.removeAttribute(a.name)});
      if(c.tagName==='A'){const h=safeUrl(c.getAttribute('href'));if(h){c.setAttribute('href',h);c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer')}else c.removeAttribute('href')}
    });
  })(t.content);
  return t.innerHTML;
}
function listHTML(items,style){
  const tag=style==='ordered'?'ol':'ul';
  return `<${tag}${style==='checklist'?' class="pv-check"':''}>${(items||[]).map(it=>{
    const txt=typeof it==='string'?it:itemText(it),chk=style==='checklist'&&it&&it.meta&&it.meta.checked;
    return `<li>${style==='checklist'?(chk?'☑ ':'☐ '):''}${cleanInline(txt)}${it&&it.items&&it.items.length?listHTML(it.items,style):''}</li>`;
  }).join('')}</${tag}>`;
}
function blocksToHTML(bl){
  return bl.map(b=>{
    const d=b.data||{};
    switch(b.type){
      case'header':{const l=Math.min(6,Math.max(1,d.level||2));return `<h${l}>${cleanInline(d.text)}</h${l}>`}
      case'paragraph':return `<p>${cleanInline(d.text)}</p>`;
      case'quote':return `<blockquote><p>${cleanInline(d.text)}</p>${d.caption?`<cite>${cleanInline(d.caption)}</cite>`:''}</blockquote>`;
      case'code':return `<pre><code>${esc(d.code||'')}</code></pre>`;
      case'delimiter':return '<hr>';
      case'list':return listHTML(d.items,d.style||'unordered');
      case'checklist':return listHTML((d.items||[]).map(x=>({content:x.text,meta:{checked:x.checked}})),'checklist');
      case'table':return `<table>${(d.content||[]).map((r,n)=>`<tr>${r.map(c=>`<${d.withHeadings&&n===0?'th':'td'}>${cleanInline(c)}</${d.withHeadings&&n===0?'th':'td'}>`).join('')}</tr>`).join('')}</table>`;
      case'image':{const f=d.file||{};const key=f.key,u=safeUrl(f.url);return `<figure>${key?`<img data-ikey="${esc(key)}" alt="${esc(stripHTML(d.caption))}">`:u?`<img src="${esc(u)}" alt="${esc(stripHTML(d.caption))}">`:''}${d.caption?`<figcaption>${cleanInline(d.caption)}</figcaption>`:''}</figure>`}
      case'embed':return `<p><a href="${esc(safeUrl(d.source))}" target="_blank" rel="noopener noreferrer">${esc(d.source||'')}</a></p>`;
      default:return '';
    }
  }).join('\n');
}
function inlineMD(s){
  let t=String(s==null?'':s);
  t=t.replace(/<(b|strong)>([\s\S]*?)<\/\1>/gi,'**$2**').replace(/<(i|em)>([\s\S]*?)<\/\1>/gi,'*$2*')
     .replace(/<code[^>]*>([\s\S]*?)<\/code>/gi,'`$1`').replace(/<mark[^>]*>([\s\S]*?)<\/mark>/gi,'==$1==')
     .replace(/<a [^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi,'[$2]($1)');
  return stripHTML(t.replace(/<br\s*\/?>/gi,'\n'));
}
function listMD(items,style,depth){
  return (items||[]).map((it,n)=>{
    const txt=inlineMD(typeof it==='string'?it:itemText(it)),pad='  '.repeat(depth);
    const mark=style==='ordered'?(n+1)+'. ':style==='checklist'?(it&&it.meta&&it.meta.checked?'- [x] ':'- [ ] '):'- ';
    return pad+mark+txt+(it&&it.items&&it.items.length?'\n'+listMD(it.items,style,depth+1):'');
  }).join('\n');
}
function blocksToMD(bl){
  return bl.map(b=>{
    const d=b.data||{};
    switch(b.type){
      case'header':return '#'.repeat(Math.min(6,Math.max(1,d.level||2)))+' '+inlineMD(d.text);
      case'paragraph':return inlineMD(d.text);
      case'quote':return '> '+inlineMD(d.text)+(d.caption?'\n> — '+inlineMD(d.caption):'');
      case'code':return '```\n'+(d.code||'')+'\n```';
      case'delimiter':return '---';
      case'list':return listMD(d.items,d.style||'unordered',0);
      case'checklist':return (d.items||[]).map(x=>(x.checked?'- [x] ':'- [ ] ')+inlineMD(x.text)).join('\n');
      case'table':return (d.content||[]).map((r,n)=>'| '+r.map(inlineMD).join(' | ')+' |'+(n===0?'\n| '+r.map(()=>'---').join(' | ')+' |':'')).join('\n');
      case'image':return '!['+stripHTML(d.caption)+']('+((d.file&&d.file.url)||'image')+')';
      case'embed':return d.source||'';
      default:return '';
    }
  }).filter(x=>x!=='').join('\n\n');
}

let EJ=null,ejIdea=null,ejUndo=null,ejSaved=Promise.resolve(),drawerFocus=false;
function commitDoc(i,out){
  const d=docOf(i);
  d.blocks=(out.blocks||[]).map(b=>(b.type==='image'&&b.data&&b.data.file&&b.data.file.key)?{...b,data:{...b.data,file:{key:b.data.file.key,url:''}}}:b);
  d.time=out.time||Date.now();
}
function unmountDraft(){
  const ed=EJ,idea=ejIdea;EJ=null;ejIdea=null;ejUndo=null;
  if(!ed)return;
  ejSaved=(async()=>{
    try{await ed.isReady;const out=await ed.save();commitDoc(idea,out);save()}catch(e){}
    try{ed.destroy()}catch(e){}
  })();
}
const readMins=n=>Math.max(1,Math.round(n/200));

async function mountDraft(i){
  await ejSaved;
  let holder=document.getElementById('ej');
  if(!holder||curId!==i.id||typeof EditorJS==='undefined')return;
  const blocks=JSON.parse(JSON.stringify(docOf(i).blocks));
  for(const b of blocks){if(b.type==='image'&&b.data&&b.data.file&&b.data.file.key){b.data.file.url=await blobURL(b.data.file.key)}}
  holder=document.getElementById('ej');
  if(!holder||!holder.isConnected||curId!==i.id||EJ)return;
  ['aTitle','aSub'].forEach(id=>{const t=document.getElementById(id);t&&growTA(t)});
  edStats(i);
  const sv=document.getElementById('edSaved');
  const ed=new EditorJS({
    holder:'ej',data:{time:docOf(i).time,blocks},placeholder:'Tell your story…',inlineToolbar:true,
    tools:{
      header:{class:Header,inlineToolbar:true,config:{levels:[1,2,3,4,5,6],defaultLevel:2}},
      list:{class:EditorjsList,inlineToolbar:true,config:{defaultStyle:'unordered'}},
      quote:{class:Quote,inlineToolbar:true,config:{quotePlaceholder:'Quote',captionPlaceholder:'Author'}},
      code:CodeTool,delimiter:Delimiter,table:{class:Table,inlineToolbar:true},
      image:{class:ImageTool,config:{captionPlaceholder:'Caption (also used as alt text)',uploader:{
        async uploadByFile(file){
          if(file.size>MAX_FILE)return {success:0};
          const key=uid();await FS.put(key,file);return {success:1,file:{key,url:await blobURL(key)}};
        },
        async uploadByUrl(url){return {success:1,file:{url}}}
      }}},
      embed:{class:Embed,inlineToolbar:true},
      inlineCode:{class:InlineCode},marker:{class:Marker},underline:{class:Underline}
    },
    onReady(){
      try{ejUndo=new Undo({editor:ed});ejUndo.initialize({blocks})}catch(e){}
      try{new DragDrop(ed)}catch(e){}
    },
    onChange:async()=>{
      if(EJ!==ed)return;
      if(sv)sv.textContent='Saving…';
      try{const out=await ed.save();if(EJ!==ed)return;commitDoc(i,out);touch(i,'a-draft');saveSoon();edStats(i);if(sv)sv.textContent='Saved'}catch(e){}
    }
  });
  EJ=ed;ejIdea=i;
}
async function edPreview(i,on){
  const pv=document.getElementById('edPrev'),h=document.getElementById('ej');if(!pv||!h)return;
  if(on&&EJ){try{commitDoc(i,await EJ.save())}catch(e){}}
  pv.hidden=!on;h.hidden=on;
  if(on){pv.innerHTML=blocksToHTML(docOf(i).blocks)||'<p class="rs-empty">Nothing written yet.</p>';hydrateImgs(pv)}
}

  const k=[];
  ((i.research&&i.research.sources)||[]).forEach(s=>s.file&&k.push(s.file.key));
  ((i.doc&&i.doc.blocks)||[]).forEach(b=>{if(b.type==='image'&&b.data&&b.data.file&&b.data.file.key)k.push(b.data.file.key)});
  if(i.meta&&i.meta.cover&&i.meta.cover.key)k.push(i.meta.cover.key);
  return k;
};
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&drawer.classList.contains('focus')){drawer.classList.remove('focus');e.stopImmediatePropagation();e.preventDefault()}
},true);
drawer.addEventListener('click',async e=>{
  const i=cur();if(!i)return;const t=e.target;let b;
  if(b=t.closest('[data-x-st]')){
    const [id,v]=b.dataset.xSt.split(':');setStat(i,id,v);save();
    const trk=document.getElementById('trk');if(trk)trk.outerHTML=trackerHTML(i,id);render();return;
  }
  if(b=t.closest('[data-x-oldel]')){const hid=b.closest('.ol-row').dataset.hid;olOp(i,'del',hid);save();olPaint(i);return}
  if(t.closest('[data-x-starter]')){
    const bl=docOf(i).blocks;['Introduction','Main points','Conclusion'].forEach(x=>bl.push(mkHeader(x,2)));
    touch(i,'a-outline');save();olPaint(i);return;
  }
  if(t.closest('[data-x-undo]')){ejUndo&&ejUndo.undo();return}
  if(t.closest('[data-x-redo]')){ejUndo&&ejUndo.redo();return}
  if(b=t.closest('[data-x-prev]')){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'Edit':'Preview';await edPreview(i,on);return}
  if(t.closest('[data-x-md]')){
    if(EJ){try{commitDoc(i,await EJ.save())}catch(err){}}
    const md=blocksToMD(docOf(i).blocks),full=(i.title?'# '+i.title+'\n\n':'')+md;
    try{await navigator.clipboard.writeText(full);toast('Markdown copied')}catch(err){toast('Could not copy. Select the text in Preview instead.')}return;
  }
  if(t.closest('[data-x-focus]')){drawer.classList.toggle('focus');return}
  if(b=t.closest('[data-x-open]')){openIdea(b.dataset.xOpen);return}
  if(t.closest('[data-x-sdel]')){
    const s=seriesOf(i);if(s&&confirm(`Delete the series "${s.name}"? The articles stay.`)){
      state.series=seriesList().filter(x=>x.id!==s.id);state.ideas.forEach(a=>{if(a.meta&&a.meta.seriesId===s.id){a.meta.seriesId='';a.meta.part=''}});save();paintDrawer();
    }return;
  }
  if(b=t.closest('[data-x-tagdel]')){i.tags=i.tags.filter(x=>x!==b.dataset.xTagdel);save();paintDrawer();render();return}
  if(t.closest('[data-x-slug]')){metaOf(i).slug=slugify(i.title);save();document.getElementById('m-slug').value=metaOf(i).slug;metaRefresh(i);return}
  if(t.closest('[data-x-thumb]')){
    const cv=drawThumb(i,+document.getElementById('thPal').value,document.getElementById('thText').value);if(!cv)return;
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)return;
    const key=uid();await FS.put(key,blob);const m=metaOf(i);if(m.cover&&m.cover.key)FS.del(m.cover.key);
    m.cover={key,name:'thumbnail.png'};m.coverUrl='';touch(i,'a-meta');save();paintDrawer();toast('Thumbnail set as cover');return;
  }
  if(b=t.closest('[data-x-dst]')){const [k,v]=b.dataset.xDst.split(':');chOf(i,k).status=v;touch(i,'a-distribute');save();paintDrawer();return}
  if(b=t.closest('[data-x-copy]')){try{await navigator.clipboard.writeText(snippet(i,b.dataset.xCopy));toast('Post copied')}catch(err){toast('Could not copy')}return}
  if(b=t.closest('[data-x-rpdel]')){distOf(i).repurpose.splice(+b.dataset.xRpdel,1);save();paintDrawer();return}
});
drawer.addEventListener('input',e=>{
  const i=cur();if(!i)return;const t=e.target;let m;
  if(t.matches&&t.matches('[data-x-ol]')){
    const bl=docOf(i).blocks,b=bl.find(x=>x.id===t.closest('.ol-row').dataset.hid);
    if(b){b.data.text=esc(t.value);docOf(i).time=Date.now();touch(i,'a-outline');saveSoon()}return;
  }
  if(t.dataset&&t.dataset.m!==undefined){
    const k=t.dataset.m,v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;
    metaOf(i)[k]=v;touch(i,'a-meta');saveSoon();metaRefresh(i);
    if(k==='part'){const row=document.querySelector(`#serList [data-id="${i.id}"] .ser-part`);if(row)row.textContent='Part '+(v||'–')}
    return;
  }
  if(t.dataset&&t.dataset.xD){
    const [k,f]=t.dataset.xD.split(':');chOf(i,k)[f]=t.value;touch(i,'a-distribute');saveSoon();
    const pre=t.closest('.ch-row').querySelector('.ch-snip');if(pre)pre.textContent=snippet(i,k);return;
  }
    if(t.id==='aTitle'){i.title=t.value;growTA(t);const h=document.getElementById('dTitle');if(h)h.textContent=t.value;saveSoon();return}
  if(t.id==='aSub'){i.summary=t.value;growTA(t);saveSoon();return}
  if(t.dataset&&t.dataset.xSname!==undefined){const s=seriesOf(i);if(s){s.name=t.value;saveSoon()}return}
  if(t.dataset&&t.dataset.xSdesc!==undefined){const s=seriesOf(i);if(s){s.desc=t.value;saveSoon()}return}
});
drawer.addEventListener('change',async e=>{
  const i=cur();if(!i)return;const t=e.target;
  if(t.matches&&t.matches('[data-x-lv]')){
    const hid=t.closest('.ol-row').dataset.hid;olOp(i,'lv',hid,+t.value);save();olPaint(i,hid);return;
  }
  if(t.matches&&t.matches('[data-x-series]')){
    const m=metaOf(i);m.seriesId=t.value;
    if(t.value&&!m.part)m.part=inSeries(t.value).filter(a=>a.id!==i.id).length+1;
    touch(i,'a-meta');save();paintDrawer();return;
  }
  if(t.matches&&t.matches('[data-x-cover]')){
    const f=t.files&&t.files[0];t.value='';if(!f)return;
    if(f.size>MAX_FILE){toast('Image is over 25 MB');return}
    const key=uid();await FS.put(key,f);const m=metaOf(i);if(m.cover&&m.cover.key)FS.del(m.cover.key);
    m.cover={key,name:f.name};m.coverUrl='';touch(i,'a-meta');save();paintDrawer();toast('Cover uploaded');
  }
});
drawer.addEventListener('submit',e=>{
  const i=cur();if(!i)return;const fm=e.target;
  if(fm.matches('[data-x-oladd]')){
    e.preventDefault();const v=fm.elements.v.value.trim();if(!v)return;
    const h=mkHeader(v,+fm.elements.lv.value);docOf(i).blocks.push(h);touch(i,'a-outline');save();olPaint(i,null);
    fm.elements.v.value='';fm.elements.v.focus();return;
  }
  if(fm.matches('[data-x-snew]')){
    e.preventDefault();const v=fm.elements.v.value.trim();if(!v)return;
    const s={id:uid(),name:v,desc:''};seriesList().push(s);const m=metaOf(i);m.seriesId=s.id;m.part=1;touch(i,'a-meta');save();paintDrawer();return;
  }
  if(fm.matches('[data-x-tagadd]')){
    e.preventDefault();const v=fm.elements.v.value.trim().replace(/^#/,'');
    if(v&&!i.tags.includes(v)&&i.tags.length<12){i.tags.push(v);touch(i,'a-meta');save();paintDrawer();render()}return;
  }
  if(fm.matches('[data-x-rpadd]')){
    e.preventDefault();const v=fm.elements.v.value.trim();if(!v)return;
    distOf(i).repurpose.push(v);touch(i,'a-distribute');save();paintDrawer();
    const nf=drawer.querySelector('[data-x-rpadd] input');nf&&nf.focus();
  }
});
drawer.addEventListener('keydown',e=>{
  const inp=e.target.closest&&e.target.closest('.ol-in');if(!inp)return;
  const i=cur();if(!i)return;const row=inp.closest('.ol-row'),hid=row.dataset.hid;
  if(e.key==='Enter'){e.preventDefault();const id=olOp(i,'add',hid);touch(i,'a-outline');save();olPaint(i,id)}
  else if(e.key==='Tab'){e.preventDefault();const b=docOf(i).blocks.find(x=>x.id===hid);olOp(i,'lv',hid,lvOf(b)+(e.shiftKey?-1:1));save();olPaint(i,hid)}
  else if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();olOp(i,e.key==='ArrowUp'?'up':'down',hid);save();olPaint(i,hid)}
  else if(e.key==='Backspace'&&!inp.value){e.preventDefault();const prev=row.previousElementSibling;olOp(i,'del',hid);save();olPaint(i,prev&&prev.dataset.hid)}
});

/* ===================== BOARD EVENTS ===================== */
$('#pipes').addEventListener('click',e=>{
  const pb=e.target.closest('[data-pf]');if(pb){pfOpen=pfOpen===pb.dataset.pf?null:pb.dataset.pf;renderPipes();return}
  const pp=e.target.closest('[data-pfpri]');if(pp){const s=pp.dataset.pfpri,c=s.indexOf(':'),f=pfOf(s.slice(0,c)),k=s.slice(c+1);f.pri=f.pri.includes(k)?f.pri.filter(x=>x!==k):[...f.pri,k];save();renderPipes();return}
  const pt=e.target.closest('[data-pftag]');if(pt){const f=pfOf(pt.dataset.pftag),t=pt.dataset.tag;f.tags=f.tags.includes(t)?f.tags.filter(x=>x!==t):[...f.tags,t];save();renderPipes();return}
  const pc=e.target.closest('[data-pfclear]');if(pc){const f=pfOf(pc.dataset.pfclear);f.pri=[];f.tags=[];save();renderPipes();return}
  if(e.target.closest('[data-pfdone]')){pfOpen=null;renderPipes();return}
  const ar=e.target.closest('[data-arch]');if(ar){e.stopPropagation();archiveIdea(ar.dataset.arch);return}
  const fo=e.target.closest('[data-open-archive]');if(fo){openArchive(fo.dataset.openArchive);return}
  const nw=e.target.closest('[data-new]');if(nw)return openCapture(nw.dataset.new);
  const sh=e.target.closest('[data-stage]');if(sh){const [pid,k]=sh.dataset.stage.split(':');return openGuide(pid,+k)}
  const c=e.target.closest('.idea');if(c)openIdea(c.dataset.id);
});
$('#pipes').addEventListener('keydown',e=>{
  const c=e.target.closest('.idea');
  if(c&&e.target===c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openIdea(c.dataset.id)}
});
/* drag & drop between stages of the same pipeline */
let dragId=null;
$('#pipes').addEventListener('dragstart',e=>{const c=e.target.closest('.idea');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
$('#pipes').addEventListener('dragend',e=>{dragId=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
$('#pipes').addEventListener('dragover',e=>{
  const w=e.target.closest('.dropwell');if(!w||!dragId)return;
  const i=state.ideas.find(x=>x.id===dragId);if(!i||i.type!==w.dataset.pipe)return;
  e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==w&&x.classList.remove('over'));w.classList.add('over');

$('#pipes').addEventListener('drop',e=>{
  const w=e.target.closest('.dropwell');if(!w||!dragId)return;
  const i=state.ideas.find(x=>x.id===dragId);if(!i||i.type!==w.dataset.pipe)return;
  e.preventDefault();if(w.dataset.folder){if(isDone(i))archiveIdea(i.id);else toast('Publish the idea before archiving it');return}const k=+w.dataset.k;
  if(k!==i.stage){i.stage=k;save();render();toast(`Moved to ${pipeOf(i).stages[k].title}`)}
});

/* filters, search, header */
$('#filters').addEventListener('click',e=>{const c=e.target.closest('[data-f]');if(!c)return;state.filter=c.dataset.f;save();render()});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderPipes()});

/* ===================== THEME + PULL-CORD BULB ===================== */
function applyTheme(t){
  const dark=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('#bulb').setAttribute('aria-checked',String(!dark));
}
function toggleTheme(){state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme(state.theme)}
(function bulb(){
  const b=$('#bulb'),svg=b.querySelector('svg'),sw=$('#bulbSwing'),cord=$('#bulbCord'),handle=$('#bulbHandle');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pull=0,vel=0,raf=0,drag=null;
  const draw=()=>{cord.setAttribute('d','M37 26 H52 V'+(116+pull));handle.setAttribute('y',116+pull)};
  const spring=()=>{
    cancelAnimationFrame(raf);
    if(reduce){pull=0;draw();return}
    const step=()=>{vel+=-pull*.22;vel*=.8;pull+=vel;draw();
      if(Math.abs(pull)>.15||Math.abs(vel)>.15)raf=requestAnimationFrame(step);else{pull=0;draw()}};
    raf=requestAnimationFrame(step);
  };
  const kick=()=>{if(reduce)return;sw.classList.remove('kick');void sw.getBoundingClientRect();sw.classList.add('kick')};
  sw.addEventListener('animationend',e=>{if(e.animationName==='kick')sw.classList.remove('kick')});
  svg.addEventListener('pointerdown',e=>{
    if(!e.target.closest('.hit'))return;
    drag={y:e.clientY,moved:false};cancelAnimationFrame(raf);vel=0;b.classList.add('dragging');
    try{svg.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dy=Math.max(0,Math.min(30,e.clientY-drag.y));
    if(dy>3)drag.moved=true;
    pull=dy;draw();
  });
  const release=cancel=>{
    if(!drag)return;
    const d=drag;drag=null;b.classList.remove('dragging');
    const fire=!cancel&&(!d.moved||pull>12);
    if(!d.moved)pull=22;               /* simple click: animate a short tug */
    if(fire){toggleTheme();kick()}
    spring();
  };
  svg.addEventListener('pointerup',()=>release(false));
  svg.addEventListener('pointercancel',()=>release(true));
  /* keyboard (Enter / Space) arrives as a click with detail 0 */
  b.addEventListener('click',e=>{if(e.detail===0){pull=22;draw();toggleTheme();kick();spring()}});
})();

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ===================== ARCHIVE ===================== */
let modalMode='capture',arc={f:'all',q:''};
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';
function archiveIdea(id){
  const i=state.ideas.find(x=>x.id===id);if(!i||!isDone(i))return;
  i.archived=true;i.archivedAt=Date.now();save();render();toast('📁 Moved to archive');
}
function restoreIdea(id){
  const i=state.ideas.find(x=>x.id===id);if(!i)return;
  i.archived=false;i.archivedAt=0;save();render();toast('↩ Restored to Published');
}
function folderHTML(p,list){
  const prev=list.slice().sort((a,b)=>(b.archivedAt||0)-(a.archivedAt||0)).slice(0,3).reverse();
  const off=3-prev.length;
  const n=list.length;
  return `<div class="arrow" aria-hidden="true"><span>›</span></div>
   <div class="stagecol archive">
    <button class="stagehead" data-open-archive="${p.id}" aria-label="Open ${esc(p.name)} archive"><span class="n">📁</span><b>Archive</b><em>${n}</em></button>
    <button class="dropwell fbtn" data-pipe="${p.id}" data-folder="1" data-open-archive="${p.id}" aria-label="Open ${esc(p.name)} archive, ${n} ideas">
      <span class="fld">
        <span class="fld-back"></span>
        ${prev.map((i,k)=>`<span class="paper p${off+k}">${esc(i.title)}</span>`).join('')}
        <span class="fld-front"><b>${n}</b><span class="lbl">${n===1?'idea':'ideas'} saved</span><small>${n?'Open archive →':'Drop a published idea here'}</small></span>
      </span>
    </button></div>`;
}
function openArchive(pipeId){
  modalMode='archive';editId=null;form=null;arc={f:pipeId||'all',q:'',s:'new'};
  modal.classList.add('full');paintArchive();openPanel(modal);
}
function arcCardHTML(i){
  const p=pipeOf(i),when=fmtDate(i.archivedAt);
  return `<article class="arc-card" style="--c:var(--${p.color})">
    <div class="ac-top"><span>${p.icon} ${esc(p.name)}</span>${when?`<span class="when">${when}</span>`:''}</div>
    <h4>${esc(i.title)}</h4>
    ${i.summary?`<p>${esc(i.summary)}</p>`:''}
    ${i.tags.length?`<div class="row">${i.tags.slice(0,4).map(t=>`<span class="tg">#${esc(t)}</span>`).join('')}</div>`:''}
    <div class="outs">${p.outputs.map(o=>`<span>${esc(o)}</span>`).join('')}</div>
    <div class="arc-act"><button class="btn" data-aopen="${i.id}">Open</button><button class="btn" data-arestore="${i.id}">↩ Restore</button><button class="btn danger" data-adelete="${i.id}" aria-label="Delete ${esc(i.title)}">🗑</button></div>
  </article>`;
}
function arcMatches(i){const q=arc.q.trim().toLowerCase();return !q||(i.title+' '+i.summary+' '+i.tags.join(' ')).toLowerCase().includes(q)}
const ARC_SORT={
  new:(a,b)=>(b.archivedAt||0)-(a.archivedAt||0),
  old:(a,b)=>(a.archivedAt||0)-(b.archivedAt||0),
  az:(a,b)=>a.title.localeCompare(b.title),
  pri:(a,b)=>['high','med','low'].indexOf(a.priority)-['high','med','low'].indexOf(b.priority)
};
function renderArcBody(){
  const body=modal.querySelector('.arc-body');if(!body)return;
  const sorter=ARC_SORT[arc.s]||ARC_SORT.new;
  const secs=PIPELINES.filter(p=>arc.f==='all'||arc.f===p.id).map(p=>{
    const list=state.ideas.filter(i=>i.archived&&i.type===p.id&&arcMatches(i)).sort(sorter);
    return list.length?`<section class="arc-sec" style="--c:var(--${p.color})"><h3>${p.icon} ${esc(p.name)} <span>${list.length}</span></h3><div class="arc-grid">${list.map(arcCardHTML).join('')}</div></section>`:'';
  }).join('');
  body.innerHTML=secs||`<div class="arc-empty"><div>📁</div><b>${arc.q?'No matches':'Nothing here yet'}</b><p>${arc.q?'Try a different search.':'Published ideas you archive are saved here as a collection.'}</p></div>`;
}
function paintArchive(){
  const all=state.ideas.filter(i=>i.archived);
  modal.style.setProperty('--c','var(--accent)');
  const navBtn=(id,ico,name,n,color)=>`<button data-af="${id}" aria-pressed="${arc.f===id}" ${color?`style="--c:var(--${color})"`:''}><span>${ico}</span>${esc(name)}<em>${n}</em></button>`;
  modal.innerHTML=`
   <header class="arc-top">
     <button class="btn" data-close>← Back to board</button>
     <div class="ttl"><div class="kicker">Collection</div><h2 id="mTitle">📁 Archive</h2></div>
     <label class="search"><span aria-hidden="true">🔍</span><input id="arcQ" type="search" placeholder="Search archive…" aria-label="Search archive" value="${esc(arc.q)}"></label>
     <select id="arcSort" class="sel" aria-label="Sort archive">${[['new','Newest first'],['old','Oldest first'],['az','Title A–Z'],['pri','Priority']].map(([v,l])=>`<option value="${v}" ${arc.s===v?'selected':''}>${l}</option>`).join('')}</select>
   </header>
   <div class="arc-layout">
     <aside class="arc-side">
       <div class="big">${all.length}</div><small>ideas saved</small>
       <nav class="arc-nav" aria-label="Filter by Prox">${navBtn('all','🗂️','All Prox',all.length)}${PIPELINES.map(p=>navBtn(p.id,p.icon,p.name,all.filter(i=>i.type===p.id).length,p.color)).join('')}</nav>
     </aside>
     <main class="arc-main"><div class="arc-body"></div></main>
   </div>`;
  renderArcBody();
}
function archiveClick(e){
  const f=e.target.closest('[data-af]');if(f){arc.f=f.dataset.af;paintArchive();return}
  const o=e.target.closest('[data-aopen]');if(o){const id=o.dataset.aopen;closeModal();openIdea(id);return}
  const r=e.target.closest('[data-arestore]');if(r){restoreIdea(r.dataset.arestore);paintArchive();return}
  const d=e.target.closest('[data-adelete]');
  if(d){const i=state.ideas.find(x=>x.id===d.dataset.adelete);
    if(i&&confirm('Delete "'+i.title+'" permanently?')){state.ideas=state.ideas.filter(x=>x!==i);save();render();paintArchive();toast('Idea deleted')}}
}
modal.addEventListener('input',e=>{if(modalMode!=='archive')return;if(e.target.id==='arcQ'){arc.q=e.target.value;renderArcBody()}else if(e.target.id==='arcSort'){arc.s=e.target.value;renderArcBody()}});
$('#btnArchive').addEventListener('click',()=>openArchive());

applyTheme(state.theme);
$('#q').value=state.q||'';
render();
</script>
